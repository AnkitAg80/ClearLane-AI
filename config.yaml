data:
  violations_csv: "dataset/jan to may police violation_anonymized791b166.csv"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
geo:
  h3_resolution: 9
  bbox:
    north: 13.2
    south: 12.7
    east: 77.8
    west: 77.3
pcu:
  "SCOOTER": 0.3
  "MOTOR CYCLE": 0.3
  "CAR": 1.0
  "PASSENGER AUTO": 0.8
  "MAXI-CAB": 2.0
  "_default": 1.0
severity:
  "WRONG PARKING": 1.0
  "NO PARKING": 1.0
  "PARKING IN A MAIN ROAD": 1.8
  "PARKING NEAR ROAD CROSSING": 2.0
  "PARKING NEAR TRAFFIC LIGHT OR ZEBRA CROSS": 2.0
  "PARKING ON FOOTPATH": 1.3
  "PARKING NEAR BUSTOP/SCHOOL/HOSPITAL ETC": 1.6
  "DOUBLE PARKING": 1.7
  "_default": 1.0
validation_weights:
  approved: 1.0
  rejected: 0.2
  created1: 0.6
  processing: 0.6
  "_unknown": 0.7
roadctx:
  network_type: "drive"
  lanes_default_by_class:
    motorway: 4
    trunk: 3
    primary: 2
    secondary: 2
    tertiary: 1
    residential: 1
    _default: 1
mappls:
  enabled: false
  cache_dir: "data/cache/mappls"
  token_url: "https://outpost.mappls.com/api/security/oauth/token"
  snap_url: "https://route.mappls.com/route/movement/snapToRoad"
  nearby_url: "https://atlas.mappls.com/api/places/nearby/json"
  poi_keywords: []
  poi_radius_m: 500

cii:
  rush_hour_weights:
    default: 1.0
    morning_peak: {start: 8, end: 11, weight: 2.0}
    evening_peak: {start: 17, end: 21, weight: 2.5}
  recurrence_bonus:
    threshold_days: 5
    multiplier: 1.5
  capacity_model: "bpr"
  capacity_weight_power: 0.5  # fallback scaling for legacy_power
  bpr_alpha: 0.15
  bpr_beta: 4
  lane_capacity_proxy: 100
  bpr_ratio_cap: 3.0

forecast:
  train_end_date: "2024-03-31"
  validation_start_date: "2024-04-01"
  bucket_freq: "1h"
  horizon_hours: 3
  target_column: "target_next_3h_cii"
  prediction_column: "pred_next_3h_cii"
  lag_hours: [1, 2, 3, 6, 12, 24, 48, 72]
  rolling_windows_hours: [3, 6, 12, 24, 72]
  ring_radii: [1, 2]
  min_training_rows: 1000
  max_training_rows: 1000000
  prepare_only_default: true
  same_hour_lags_days: [1, 7]
  ewm_halflife_hours: [3, 12, 24]
  negative_sampling_ratio: 4
  high_target_weight: 5.0
  deployment_score_column: "deployment_score"
  blend:
    regression: 0.65
    rank: 0.35
  ranker:
    enabled: true
    objective: "rank_xendcg"
    relevance_bins: [0.0, 0.5, 2.0, 5.0, 15.0]
    n_estimators: 120
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    n_jobs: 1
    force_col_wise: true
  model:
    objective: "regression"
    n_estimators: 160
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.9
    colsample_bytree: 0.9
    random_state: 42
    n_jobs: 1
    force_col_wise: true
  features:
    - hour
    - dow
    - is_weekend
    - month
    - lanes
    - record_count
    - support_score
    - data_quality_score
    - approved_rate
    - rejected_rate
    - current_cii
    - current_violation_count
    - capacity_ratio
    - confidence_score
    - cii_lag_1h
    - cii_lag_2h
    - cii_lag_3h
    - cii_lag_6h
    - cii_lag_12h
    - cii_lag_24h
    - cii_lag_48h
    - cii_lag_72h
    - cii_roll_3h_mean
    - cii_roll_6h_mean
    - cii_roll_12h_mean
    - cii_roll_24h_mean
    - cii_roll_72h_mean
    - violations_lag_1h
    - violations_lag_3h
    - violations_lag_24h
    - ring1_current_cii_mean
    - ring1_roll_3h_cii_mean
    - ring2_current_cii_mean
    - ring2_roll_3h_cii_mean
    - current_capacity_ratio
    - current_capacity_component
    - current_temporal_component
    - cii_same_hour_1d
    - cii_same_hour_7d
    - cii_ewm_3h
    - cii_ewm_12h
    - cii_ewm_24h
    - hours_since_last_violation
    - active_hour_streak
    - quiet_hour_streak
    - location_count_log
    - station_count_log
    - junction_count_log
    - cell_total_rank_pct
    - ring1_active_neighbor_count
    - ring2_active_neighbor_count
optimize:
  officer_budget: 100
  effectiveness_base: 0.3    # An officer clears 30% of congestion
  decay_factor: 0.8          # Marginal utility decay per added officer
